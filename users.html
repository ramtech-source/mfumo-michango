<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e40af">
    <title>Walimu na Watumiaji</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <img src="icons/icon-192.png" alt="Logo" class="nav-logo" onerror="this.style.display='none'">
            <span data-school-name>SHULE YA MSINGI NGARENARO</span>
        </div>
        <div class="nav-user">
            <span id="userName">...</span>
            <button id="homeBtn" class="btn btn-sm">← Nyumbani</button>
            <button id="logoutBtn" class="btn btn-sm">Ondoka</button>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="flex-between mb-3">
                <h2>Walimu na Watumiaji</h2>
                <button class="btn btn-success btn-sm" id="addBtn">+ Ongeza Mtumiaji</button>
            </div>

            <div id="messageBox" style="display:none;"></div>

            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Jina</th>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Darasa</th>
                            <th>Simu</th>
                            <th>Hali</th>
                            <th>Kitendo</th>
                        </tr>
                    </thead>
                    <tbody id="tbody">
                        <tr><td colspan="7" class="text-center">Inapakia...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="modal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:1000; padding:20px; overflow-y:auto;">
        <div style="background:white; border-radius:10px; padding:25px; max-width:500px; margin:40px auto;">
            <h3 id="modalTitle" style="color:#1e40af; margin-bottom:15px;">Ongeza Mtumiaji</h3>
            <input type="hidden" id="editId">
            <div class="form-group"><label>Jina Kamili *</label><input type="text" id="fullName" required></div>
            <div class="form-group"><label>Username *</label><input type="text" id="username" required></div>
            <div class="form-group">
                <label>Nenosiri <span id="passHint" style="color:#666; font-weight:normal;"></span></label>
                <input type="text" id="password" placeholder="Weka nenosiri">
            </div>
            <div class="form-group"><label>Simu</label><input type="text" id="phone"></div>
            <div class="form-group">
                <label>Role *</label>
                <select id="role">
                    <option value="teacher">Mwalimu</option>
                    <option value="deputy_head_teacher">Naibu Mkuu</option>
                    <option value="head_teacher">Mkuu wa Shule</option>
                    <option value="administrator">Msimamizi</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Darasa Alilopewa</label>
                    <select id="assignedClass"><option value="">-- Hakuna --</option></select>
                </div>
                <div class="form-group">
                    <label>Stream Aliyopewa</label>
                    <select id="assignedStream"><option value="">-- Hakuna --</option></select>
                </div>
            </div>
            <div id="err" class="error-message" style="display:none;"></div>
            <div class="flex gap-2">
                <button class="btn btn-primary" id="saveBtn">Hifadhi</button>
                <button class="btn btn-outline" id="cancelBtn">Ghairi</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const session = AuthService.requireAuth();
        if (session) {
            document.getElementById('userName').textContent = session.full_name;
            init();
        }

        let classes = [], streams = [], users = [];

        async function init() {
            const { data: school } = await supabaseClient
                .from('schools').select('*').eq('school_id', session.school_id).single();
            if (school) {
                document.querySelectorAll('[data-school-name]').forEach(el => el.textContent = school.school_name);
            }

            const [c, s] = await Promise.all([
                supabaseClient.from('classes').select('*').eq('school_id', session.school_id).order('display_order'),
                supabaseClient.from('streams').select('*')
            ]);
            classes = c.data || [];
            streams = s.data || [];

            // Populate class select
            const nc = document.getElementById('assignedClass');
            classes.forEach(cl => {
                const o = document.createElement('option');
                o.value = cl.class_id;
                o.textContent = cl.class_name;
                nc.appendChild(o);
            });

            await loadUsers();
        }

        document.getElementById('assignedClass').addEventListener('change', (e) => {
            const sel = document.getElementById('assignedStream');
            sel.innerHTML = '<option value="">-- Hakuna --</option>';
            streams.filter(s => s.class_id === e.target.value).forEach(s => {
                const o = document.createElement('option');
                o.value = s.stream_id;
                o.textContent = s.stream_name;
                sel.appendChild(o);
            });
        });

        async function loadUsers() {
            const { data, error } = await supabaseClient
                .from('users')
                .select('*')
                .eq('school_id', session.school_id)
                .order('full_name');

            if (error) { showMessage('error', error.message); return; }
            users = data || [];
            renderTable();
        }
function renderTable() {
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';
    users.forEach(u => {
        const cls = classes.find(c => c.class_id === u.assigned_class);
        const strm = streams.find(s => s.stream_id === u.assigned_stream);

        const roleLabels = {
            administrator: 'Msimamizi',
            head_teacher: 'Mkuu',
            deputy_head_teacher: 'Naibu Mkuu',
            teacher: 'Mwalimu'
        };

        // ============================================
        // SECURITY: Angalia kama mtu anaweza kuhariri mtumiaji huyu
        // ============================================
        let canEdit = true;

        // 1. Mtu hawezi kuhariri/kufuta MWENYEWE (kama ni Msimamizi wa mwisho)
        // 2. Mkuu hawezi kuhariri/kufuta Msimamizi mwingine
        // 3. Mwalimu wa kawaida hawezi kuhariri mtu yeyote
        // 4. Mkuu hawezi kuhariri Mkuu mwingine (except mwenyewe)

        if (session.role === 'head_teacher') {
            // Mkuu hawezi kuhariri administrator
            if (u.role === 'administrator') {
                canEdit = false;
            }
        }

        if (session.role === 'deputy_head_teacher') {
            // Naibu Mkuu hawezi kuhariri administrator wala head_teacher
            if (u.role === 'administrator' || u.role === 'head_teacher') {
                canEdit = false;
            }
        }

        if (session.role === 'teacher') {
            // Mwalimu wa kawaida hawezi kuhariri mtu yeyote
            canEdit = false;
        }

        // Mtu hawezi kuhariri MWENYEWE (kuzuia kujifuta)
        if (u.user_id === session.user_id) {
            canEdit = false;
        }

        // ============================================
        // Unda vitufe kulingana na ruhusa
        // ============================================
        let actionsHTML = '';
        if (canEdit) {
            actionsHTML = `
                <button class="btn btn-sm btn-outline" onclick="editUser('${u.user_id}')">Hariri</button>
                <button class="btn btn-sm ${u.status === 'active' ? 'btn-danger' : 'btn-success'}" onclick="toggleUser('${u.user_id}', '${u.status}')">${u.status === 'active' ? 'Zima' : 'Washa'}</button>
            `;
        } else {
            // Onyesha badge ya "Imefungwa" au "Wewe"
            if (u.user_id === session.user_id) {
                actionsHTML = `<span style="color:#666; font-size:12px; font-style:italic;">👤 Wewe</span>`;
            } else {
                actionsHTML = `<span style="color:#999; font-size:12px; font-style:italic;">🔒 Imefungwa</span>`;
            }
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${u.full_name}</td>
            <td><code>${u.username}</code></td>
            <td><span class="badge badge-info" style="background:#dbeafe;color:#1e40af;">${roleLabels[u.role] || u.role}</span></td>
            <td>${cls ? cls.class_name + ' ' + (strm?.stream_name || '') : '-'}</td>
            <td>${u.phone || '-'}</td>
            <td><span class="badge ${u.status === 'active' ? 'badge-success' : 'badge-danger'}">${u.status === 'active' ? 'Hai' : 'Haifanyi'}</span></td>
            <td style="white-space:nowrap;">${actionsHTML}</td>`;
        tbody.appendChild(tr);
    });
}
