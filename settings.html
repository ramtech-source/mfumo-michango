<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e40af">
    <title>Mipangilio ya Shule</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <img src="icons/icon-192.png" alt="Logo" class="nav-logo" onerror="this.style.display='none'">
            <span data-school-name>SHULE YA MSINGI NGARENARO</span>
        </div>
        <div class="nav-user">
            <span id="userName">...</span>
            <button id="homeBtn" class="btn btn-sm">← Nyumbani</button>
            <button id="logoutBtn" class="btn btn-sm">Ondoka</button>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Taarifa za Shule</h2>
            <p style="color:#666; margin-bottom:20px;">Badilisha taarifa za shule. Mabadiliko yataonekana kwenye dashibodi, risiti, na ripoti zote.</p>

            <form id="schoolForm">
                <div class="form-group">
                    <label>Jina la Shule *</label>
                    <input type="text" id="schoolName" required>
                </div>
                <div class="form-group">
                    <label>Nembo (Logo URL)</label>
                    <input type="text" id="logoUrl" placeholder="https://...">
                    <small style="color:#666; font-size:12px;">Weka link ya picha ya shule (PNG/JPG)</small>
                </div>
                <div class="form-group">
                    <label>Anwani</label>
                    <input type="text" id="address" placeholder="mfano: S.L.P 123, Arusha">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Simu</label>
                        <input type="text" id="phone" placeholder="+255 712 345 678">
                    </div>
                    <div class="form-group">
                        <label>Barua Pepe</label>
                        <input type="email" id="email" placeholder="shule@example.com">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Namba ya Usajili</label>
                        <input type="text" id="regNo">
                    </div>
                    <div class="form-group">
                        <label>Motto</label>
                        <input type="text" id="motto">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Mwaka wa Shule *</label>
                        <input type="text" id="academicYear" placeholder="2026">
                    </div>
                    <div class="form-group">
                        <label>Muhula wa Sasa *</label>
                        <select id="currentTerm">
                            <option value="Muhula 1">Muhula 1</option>
                            <option value="Muhula 2">Muhula 2</option>
                            <option value="Muhula 3">Muhula 3</option>
                        </select>
                    </div>
                </div>

                <div id="msg" style="display:none;"></div>

                <button type="submit" class="btn btn-primary btn-block mt-3" id="saveBtn">Hifadhi Mabadiliko</button>
            </form>
        </div>

        <div class="card">
            <h2>Preview</h2>
            <div style="border:1px solid #e5e7eb; border-radius:8px; padding:20px; text-align:center; background:#f9fafb;">
                <img id="previewLogo" src="icons/icon-192.png" style="width:60px; height:60px; border-radius:50%; object-fit:cover; margin-bottom:10px;" onerror="this.style.display='none'">
                <h3 id="previewName" style="color:#1e40af; margin-bottom:5px;">SHULE YA MSINGI NGARENARO</h3>
                <p id="previewMotto" style="color:#666; font-style:italic; font-size:13px;"></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const session = AuthService.requireRole(['administrator']);
        if (session) {
            document.getElementById('userName').textContent = session.full_name;
            loadSchool();
        }

        async function loadSchool() {
            const { data, error } = await supabaseClient
                .from('schools')
                .select('*')
                .eq('school_id', session.school_id)
                .single();

            if (error) {
                console.error(error);
                return;
            }
            if (!data) return;

            document.getElementById('schoolName').value = data.school_name || '';
            document.getElementById('logoUrl').value = data.logo_url || '';
            document.getElementById('address').value = data.address || '';
            document.getElementById('phone').value = data.phone || '';
            document.getElementById('email').value = data.email || '';
            document.getElementById('regNo').value = data.registration_number || '';
            document.getElementById('motto').value = data.motto || '';
            document.getElementById('academicYear').value = data.academic_year || '2026';
            document.getElementById('currentTerm').value = data.current_term || 'Muhula 1';

            updatePreview();
        }

        function updatePreview() {
            document.getElementById('previewName').textContent = document.getElementById('schoolName').value || 'SHULE YA MSINGI NGARENARO';
            document.getElementById('previewMotto').textContent = document.getElementById('motto').value || '';
            const logoUrl = document.getElementById('logoUrl').value;
            if (logoUrl) {
                const img = document.getElementById('previewLogo');
                img.src = logoUrl;
                img.style.display = 'block';
            }
        }

        document.getElementById('schoolName').addEventListener('input', updatePreview);
        document.getElementById('motto').addEventListener('input', updatePreview);
        document.getElementById('logoUrl').addEventListener('input', updatePreview);

        document.getElementById('schoolForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            const msg = document.getElementById('msg');
            btn.disabled = true;
            btn.textContent = 'Inahifadhi...';
            msg.style.display = 'none';

            try {
                const updates = {
                    school_name: document.getElementById('schoolName').value.trim(),
                    logo_url: document.getElementById('logoUrl').value.trim() || null,
                    address: document.getElementById('address').value.trim() || null,
                    phone: document.getElementById('phone').value.trim() || null,
                    email: document.getElementById('email').value.trim() || null,
                    registration_number: document.getElementById('regNo').value.trim() || null,
                    motto: document.getElementById('motto').value.trim() || null,
                    academic_year: document.getElementById('academicYear').value.trim() || '2026',
                    current_term: document.getElementById('currentTerm').value,
                    updated_at: new Date().toISOString()
                };

                if (!updates.school_name) throw new Error('Jina la shule ni lazima');

                const { error } = await supabaseClient
                    .from('schools')
                    .update(updates)
                    .eq('school_id', session.school_id);

                if (error) throw error;

                msg.className = 'success-message';
                msg.textContent = '✅ Mabadiliko yamehifadhiwa!';
                msg.style.display = 'block';

                document.querySelectorAll('[data-school-name]').forEach(el => {
                    el.textContent = updates.school_name;
                });

                setTimeout(() => msg.style.display = 'none', 4000);
            } catch (err) {
                msg.className = 'error-message';
                msg.textContent = '❌ Hitilafu: ' + err.message;
                msg.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Hifadhi Mabadiliko';
            }
        });

        document.getElementById('homeBtn').onclick = () => {
            window.location.href = 'admin-dashboard.html';
        };
        document.getElementById('logoutBtn').onclick = () => AuthService.logout();
    </script>
</body>
</html>
