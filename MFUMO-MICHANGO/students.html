<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e40af">
    <title>Wanafunzi</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <img src="icons/icon-192.png" alt="Logo" class="nav-logo" onerror="this.style.display='none'">
            <span data-school-name>SHULE YA MSINGI NGARENARO</span>
        </div>
        <div class="nav-user">
            <span id="userName">...</span>
            <button id="homeBtn" class="btn btn-sm">← Nyumbani</button>
            <button id="logoutBtn" class="btn btn-sm">Ondoka</button>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="flex-between mb-3" style="flex-wrap:wrap; gap:8px;">
                <h2>Wanafunzi</h2>
                <div class="flex gap-2" style="flex-wrap:wrap;">
                    <button class="btn btn-outline btn-sm" id="downloadTemplateBtn">📥 Pakua Template</button>
                    <button class="btn btn-outline btn-sm" id="exportBtn">📤 Export</button>
                    <button class="btn btn-primary btn-sm" id="importBtn">📂 Pakia Excel</button>
                    <button class="btn btn-success btn-sm" id="addBtn">+ Ongeza</button>
                </div>
            </div>

            <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none;">

            <div class="form-row mb-3">
                <div class="form-group">
                    <label>Filter kwa Darasa</label>
                    <select id="filterClass">
                        <option value="">-- Madarasa Yote --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tafuta</label>
                    <input type="text" id="search" placeholder="Jina au Student ID...">
                </div>
            </div>

            <div id="messageBox" style="display:none;"></div>

            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Student ID</th>
                            <th>Jina</th>
                            <th>Darasa</th>
                            <th>Stream</th>
                            <th>Hali</th>
                            <th>Kitendo</th>
                        </tr>
                    </thead>
                    <tbody id="tbody">
                        <tr><td colspan="7" class="text-center">Inapakia...</td></tr>
                    </tbody>
                </table>
            </div>
            <p id="countInfo" style="margin-top:10px; color:#666; font-size:13px;"></p>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="addModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:1000; padding:20px; overflow-y:auto;">
        <div style="background:white; border-radius:10px; padding:25px; max-width:500px; margin:40px auto;">
            <h3 id="modalTitle" style="color:#1e40af; margin-bottom:15px;">Ongeza Mwanafunzi</h3>
            <input type="hidden" id="editId">
            <div class="form-group"><label>Student ID</label><input type="text" id="newCode" required></div>
            <div class="form-group"><label>Jina Kamili</label><input type="text" id="newName" required></div>
            <div class="form-row">
                <div class="form-group">
                    <label>Darasa</label>
                    <select id="newClass"><option value="">-- Chagua --</option></select>
                </div>
                <div class="form-group">
                    <label>Stream</label>
                    <select id="newStream"><option value="">-- Chagua --</option></select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Jinsia</label>
                    <select id="newGender">
                        <option value="">--</option>
                        <option>Me</option>
                        <option>Ke</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Hali</label>
                    <select id="newStatus">
                        <option value="active">Hai</option>
                        <option value="inactive">Haifanyi kazi</option>
                    </select>
                </div>
            </div>
            <div class="form-group"><label>Mzazi/Mlezi</label><input type="text" id="newParent"></div>
            <div class="form-group"><label>Simu ya Mzazi</label><input type="text" id="newPhone"></div>
            <div id="addError" class="error-message" style="display:none;"></div>
            <div class="flex gap-2">
                <button class="btn btn-primary" id="saveNewBtn">Hifadhi</button>
                <button class="btn btn-outline" id="cancelAddBtn">Ghairi</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const session = AuthService.requireAuth();
        if (session) {
            document.getElementById('userName').textContent = session.full_name;
            init();
        }

        let classes = [];
        let streams = [];
        let students = [];

        async function init() {
            // Load school
            const { data: school } = await supabaseClient
                .from('schools').select('*').eq('school_id', session.school_id).single();
            if (school) {
                document.querySelectorAll('[data-school-name]').forEach(el => el.textContent = school.school_name);
            }

            // Load classes
            const { data: c } = await supabaseClient
                .from('classes').select('*').eq('school_id', session.school_id).order('display_order');
            classes = c || [];

            // Load streams
            const { data: s } = await supabaseClient.from('streams').select('*');
            streams = s || [];

            populateSelects();
            await loadStudents();
        }

        function populateSelects() {
            // Filter select
            const fc = document.getElementById('filterClass');
            classes.forEach(c => {
                const o = document.createElement('option');
                o.value = c.class_id;
                o.textContent = c.class_name;
                fc.appendChild(o);
            });

            // Modal - new class
            const nc = document.getElementById('newClass');
            classes.forEach(c => {
                const o = document.createElement('option');
                o.value = c.class_id;
                o.textContent = c.class_name;
                nc.appendChild(o);
            });
        }

        document.getElementById('newClass').addEventListener('change', (e) => {
            const sel = document.getElementById('newStream');
            sel.innerHTML = '<option value="">-- Chagua --</option>';
            streams.filter(s => s.class_id === e.target.value).forEach(s => {
                const o = document.createElement('option');
                o.value = s.stream_id;
                o.textContent = s.stream_name;
                sel.appendChild(o);
            });
        });

        async function loadStudents() {
            const { data, error } = await supabaseClient
                .from('students')
                .select('*')
                .eq('school_id', session.school_id)
                .order('full_name');

            if (error) {
                showMessage('error', 'Hitilafu: ' + error.message);
                return;
            }
            students = data || [];
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('tbody');
            const search = document.getElementById('search').value.toLowerCase();
            const classFilter = document.getElementById('filterClass').value;

            let filtered = students;
            if (classFilter) {
                filtered = filtered.filter(s => s.class_id === classFilter);
            }
            if (search) {
                filtered = filtered.filter(s =>
                    s.full_name.toLowerCase().includes(search) ||
                    (s.student_code || '').toLowerCase().includes(search)
                );
            }

            document.getElementById('countInfo').textContent =
                `Jumla: ${filtered.length} kati ya ${students.length} wanafunzi`;

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center">Hakuna wanafunzi</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            filtered.forEach((s, i) => {
                const cls = classes.find(c => c.class_id === s.class_id);
                const strm = streams.find(x => x.stream_id === s.stream_id);

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${i + 1}</td>
                    <td>${s.student_code || '-'}</td>
                    <td>${s.full_name}</td>
                    <td>${cls?.class_name || '-'}</td>
                    <td>${strm?.stream_name || '-'}</td>
                    <td><span class="badge ${s.status === 'active' ? 'badge-success' : 'badge-danger'}">${s.status === 'active' ? 'Hai' : 'Haifanyi'}</span></td>
                    <td style="white-space:nowrap;">
                        <button class="btn btn-sm btn-outline" onclick="editStudent('${s.student_id}')">Hariri</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteStudent('${s.student_id}')">Futa</button>
                    </td>`;
                tbody.appendChild(tr);
            });
        }

        function showMessage(type, text) {
            const box = document.getElementById('messageBox');
            box.className = type === 'error' ? 'error-message' : 'success-message';
            box.textContent = text;
            box.style.display = 'block';
            setTimeout(() => box.style.display = 'none', 5000);
        }

        // Add button
        document.getElementById('addBtn').onclick = () => {
            document.getElementById('modalTitle').textContent = 'Ongeza Mwanafunzi';
            document.getElementById('editId').value = '';
            ['newCode','newName','newParent','newPhone'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('newClass').value = '';
            document.getElementById('newStream').innerHTML = '<option value="">-- Chagua --</option>';
            document.getElementById('newGender').value = '';
            document.getElementById('newStatus').value = 'active';
            document.getElementById('addError').style.display = 'none';
            document.getElementById('addModal').style.display = 'block';
        };

        document.getElementById('cancelAddBtn').onclick = () => {
            document.getElementById('addModal').style.display = 'none';
        };

        // Edit
        window.editStudent = (id) => {
            const s = students.find(x => x.student_id === id);
            if (!s) return;
            document.getElementById('modalTitle').textContent = 'Hariri Mwanafunzi';
            document.getElementById('editId').value = s.student_id;
            document.getElementById('newCode').value = s.student_code || '';
            document.getElementById('newName').value = s.full_name || '';
            document.getElementById('newClass').value = s.class_id || '';
            document.getElementById('newClass').dispatchEvent(new Event('change'));
            setTimeout(() => {
                document.getElementById('newStream').value = s.stream_id || '';
            }, 50);
            document.getElementById('newGender').value = s.gender || '';
            document.getElementById('newStatus').value = s.status || 'active';
            document.getElementById('newParent').value = s.parent_name || '';
            document.getElementById('newPhone').value = s.parent_phone || '';
            document.getElementById('addError').style.display = 'none';
            document.getElementById('addModal').style.display = 'block';
        };

        // Save
        document.getElementById('saveNewBtn').onclick = async () => {
            const err = document.getElementById('addError');
            err.style.display = 'none';

            const data = {
                school_id: session.school_id,
                student_code: document.getElementById('newCode').value.trim(),
                full_name: document.getElementById('newName').value.trim(),
                class_id: document.getElementById('newClass').value || null,
                stream_id: document.getElementById('newStream').value || null,
                gender: document.getElementById('newGender').value || null,
                parent_name: document.getElementById('newParent').value.trim() || null,
                parent_phone: document.getElementById('newPhone').value.trim() || null,
                status: document.getElementById('newStatus').value
            };

            if (!data.student_code || !data.full_name) {
                err.textContent = 'Jaza Student ID na Jina';
                err.style.display = 'block';
                return;
            }

            const editId = document.getElementById('editId').value;
            try {
                let result;
                if (editId) {
                    result = await supabaseClient.from('students').update(data).eq('student_id', editId);
                } else {
                    result = await supabaseClient.from('students').insert(data);
                }

                if (result.error) throw result.error;

                document.getElementById('addModal').style.display = 'none';
                showMessage('success', editId ? 'Mwanafunzi amehaririwa!' : 'Mwanafunzi ameongezwa!');
                await loadStudents();
            } catch (e) {
                err.textContent = e.message;
                err.style.display = 'block';
            }
        };

        // Delete
        window.deleteStudent = async (id) => {
            if (!confirm('Una uhakika unataka kufuta mwanafunzi huyu?')) return;
            const { error } = await supabaseClient.from('students').delete().eq('student_id', id);
            if (error) {
                alert('Hitilafu: ' + error.message);
                return;
            }
            showMessage('success', 'Mwanafunzi amefutwa');
            await loadStudents();
        };

        // Search & filter
        document.getElementById('search').addEventListener('input', renderTable);
        document.getElementById('filterClass').addEventListener('change', renderTable);

        // Download template
        document.getElementById('downloadTemplateBtn').onclick = () => {
            const data = [
                {
                    'Student ID': 'STD001',
                    'Jina Kamili': 'Juma Hassan',
                    'Darasa': 'Grade 1',
                    'Stream': 'A',
                    'Jinsia': 'Me',
                    'Mzazi/Mlezi': 'Hassan Mwinyi',
                    'Simu': '0712345678',
                    'Hali': 'active'
                },
                {
                    'Student ID': 'STD002',
                    'Jina Kamili': 'Amina Said',
                    'Darasa': 'Grade 1',
                    'Stream': 'A',
                    'Jinsia': 'Ke',
                    'Mzazi/Mlezi': 'Said Ally',
                    'Simu': '0712345679',
                    'Hali': 'active'
                }
            ];
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Wanafunzi');
            XLSX.writeFile(wb, 'template_wanafunzi.xlsx');
        };

        // Import
        document.getElementById('importBtn').onclick = () => document.getElementById('fileInput').click();
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                const buf = await file.arrayBuffer();
                const wb = XLSX.read(buf, { type: 'array' });
                const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);

                if (rows.length === 0) throw new Error('File haina data');

                const toInsert = [];
                for (const row of rows) {
                    const code = String(row['Student ID'] || '').trim();
                    const name = String(row['Jina Kamili'] || '').trim();
                    const clsName = String(row['Darasa'] || '').trim();
                    const strName = String(row['Stream'] || '').trim();
                    if (!code || !name) continue;

                    const cls = classes.find(c => c.class_name === clsName);
                    const str = cls ? streams.find(s => s.class_id === cls.class_id && s.stream_name === strName) : null;

                    toInsert.push({
                        school_id: session.school_id,
                        student_code: code,
                        full_name: name,
                        class_id: cls?.class_id || null,
                        stream_id: str?.stream_id || null,
                        gender: String(row['Jinsia'] || '').trim() || null,
                        parent_name: String(row['Mzazi/Mlezi'] || '').trim() || null,
                        parent_phone: String(row['Simu'] || '').trim() || null,
                        status: String(row['Hali'] || 'active').trim()
                    });
                }

                if (toInsert.length === 0) throw new Error('Hakuna data halali');

                const { error } = await supabaseClient
                    .from('students')
                    .upsert(toInsert, { onConflict: 'school_id,student_code' });

                if (error) throw error;

                showMessage('success', `Wanafunzi ${toInsert.length} wamepakiwa!`);
                await loadStudents();
            } catch (err) {
                showMessage('error', 'Hitilafu: ' + err.message);
            }
            e.target.value = '';
        });

        // Export
        document.getElementById('exportBtn').onclick = () => {
            const data = students.map(s => {
                const cls = classes.find(c => c.class_id === s.class_id);
                const strm = streams.find(x => x.stream_id === s.stream_id);
                return {
                    'Student ID': s.student_code,
                    'Jina Kamili': s.full_name,
                    'Darasa': cls?.class_name || '',
                    'Stream': strm?.stream_name || '',
                    'Jinsia': s.gender || '',
                    'Mzazi/Mlezi': s.parent_name || '',
                    'Simu': s.parent_phone || '',
                    'Hali': s.status
                };
            });
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Wanafunzi');
            XLSX.writeFile(wb, 'wanafunzi_' + new Date().toISOString().split('T')[0] + '.xlsx');
        };

        // Nav
        document.getElementById('homeBtn').onclick = () => {
            window.location.href = session.role === 'administrator' ? 'admin-dashboard.html' : 'teacher-dashboard.html';
        };
        document.getElementById('logoutBtn').onclick = () => AuthService.logout();
    </script>
</body>
</html>
