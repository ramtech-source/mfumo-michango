<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e40af">
    <title>Dashibodi ya Msimamizi</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <img src="icons/icon-192.png" alt="Logo" class="nav-logo" onerror="this.style.display='none'">
            <span data-school-name>SHULE YA MSINGI NGARENARO</span>
        </div>
        <div class="nav-user">
            <span id="userName">...</span>
            <button id="logoutBtn" class="btn btn-sm">Ondoka</button>
        </div>
    </nav>

    <div class="container">
        <h2 style="margin-bottom:20px;color:#1e40af;">Dashibodi ya Msimamizi</h2>

        <div class="dashboard-grid">
            <div class="stat-card card">
                <h3>Wanafunzi</h3>
                <p class="stat-value" id="statStudents">-</p>
            </div>
            <div class="stat-card card">
                <h3>Walimu</h3>
                <p class="stat-value" id="statTeachers">-</p>
            </div>
            <div class="stat-card card">
                <h3>Madarasa</h3>
                <p class="stat-value" id="statClasses">-</p>
            </div>
            <div class="stat-card card">
                <h3>Makusanyo Leo</h3>
                <p class="stat-value" id="statToday">-</p>
            </div>
        </div>

        <div class="card">
            <h2>Menu Kuu</h2>
            <div class="dashboard-grid">
                <a href="students.html" class="btn btn-outline">📚 Wanafunzi</a>
                <a href="users.html" class="btn btn-outline">👨‍🏫 Walimu</a>
                <a href="classes.html" class="btn btn-outline">🏫 Madarasa</a>
                <a href="contributions.html" class="btn btn-outline">💰 Michango</a>
                <a href="settings.html" class="btn btn-outline">⚙️ Mipangilio</a>
                <a href="audit.html" class="btn btn-outline">📋 Audit Log</a>
                <a href="backup.html" class="btn btn-outline">💾 Backup</a>
                <a href="teacher-dashboard.html" class="btn btn-outline">✏️ Ukusanyaji</a>
            </div>
        </div>

        <div class="card">
            <h2>Taarifa za Mfumo</h2>
            <p><strong>Mtandao:</strong> <span id="netStatus">-</span></p>
            <p><strong>Tarehe:</strong> <span id="todayDate">-</span></p>
            <p><strong>Mwaka wa Shule:</strong> <span id="academicYear">-</span></p>
            <p><strong>Term:</strong> <span id="currentTerm">-</span></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Angalia kama ameingia
        const session = AuthService.requireAuth();
        if (!session) throw new Error('Haujaingia');

        // Angalia role
        if (session.role !== 'administrator') {
            alert('Ukurasa huu ni kwa Msimamizi tu');
            window.location.href = 'teacher-dashboard.html';
        }

        // Weka jina la mtumiaji
        document.getElementById('userName').textContent = session.full_name;

        // Tarehe ya leo
        document.getElementById('todayDate').textContent = new Date().toLocaleDateString('sw-TZ');

        // Mtandao
        function updateNetStatus() {
            document.getElementById('netStatus').textContent =
                navigator.onLine ? '✅ Upo' : '❌ Haupo';
        }
        updateNetStatus();
        window.addEventListener('online', updateNetStatus);
        window.addEventListener('offline', updateNetStatus);

        // Load data
        async function loadData() {
            try {
                // Pata shule
                const { data: school } = await supabaseClient
                    .from('schools')
                    .select('*')
                    .eq('school_id', session.school_id)
                    .single();

                if (school) {
                    document.querySelectorAll('[data-school-name]').forEach(el => {
                        el.textContent = school.school_name;
                    });
                    document.getElementById('academicYear').textContent = school.academic_year;
                    document.getElementById('currentTerm').textContent = school.current_term;
                }

                // Hesabu wanafunzi
                const { count: studentCount } = await supabaseClient
                    .from('students')
                    .select('*', { count: 'exact', head: true })
                    .eq('school_id', session.school_id)
                    .eq('status', 'active');
                document.getElementById('statStudents').textContent = studentCount || 0;

                // Hesabu walimu
                const { count: teacherCount } = await supabaseClient
                    .from('users')
                    .select('*', { count: 'exact', head: true })
                    .eq('school_id', session.school_id)
                    .eq('status', 'active');
                document.getElementById('statTeachers').textContent = teacherCount || 0;

                // Hesabu madarasa
                const { count: classCount } = await supabaseClient
                    .from('classes')
                    .select('*', { count: 'exact', head: true })
                    .eq('school_id', session.school_id);
                document.getElementById('statClasses').textContent = classCount || 0;

                // Makusanyo ya leo
                const today = new Date().toISOString().split('T')[0];
                const { data: payments } = await supabaseClient
                    .from('payments')
                    .select('amount')
                    .eq('school_id', session.school_id)
                    .eq('payment_date', today)
                    .eq('is_deleted', false);

                const total = (payments || []).reduce((s, p) => s + Number(p.amount), 0);
                document.getElementById('statToday').textContent = 'Tsh ' + total.toLocaleString();

            } catch (err) {
                console.error('Error loading data:', err);
            }
        }

        loadData();

        // Logout
        document.getElementById('logoutBtn').onclick = () => AuthService.logout();

        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
        }
    </script>
</body>
</html>
